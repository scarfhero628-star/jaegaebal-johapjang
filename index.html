<style>
:root{
  /* 밤의 조합 사무실: 장면 그림 위에 상아색 서류철, 금박 테두리, 진홍 현수막. 글꼴은 고딕(Pretendard) 하나로 굵기만 달리한다. */
  --paper:#0d1526; --sheet:#f8f4ea; --white:#fffdf8; --ink:#18223a; --muted:#5b6476; --line:#ddd2b9;
  --banner:#9e2f39; --banner-ink:#fff4df; --hazard:#e8ad00; --hazard-tint:#fcf3d8;
  --agree:#22436a; --good:#2e7a4d; --bad:#b3261e;
  --gold:#c9a14a; --gold-hi:#f3d98f; --gold-lo:#7e5c18; --gold-line:rgba(201,161,74,.6);
  --f-display:"Pretendard GJ","Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;
  --f-body:var(--f-display); --f-news:var(--f-display);
  --sh-panel:inset 0 1px 0 rgba(255,255,255,.8),0 0 0 1px rgba(8,12,22,.45),0 22px 44px -22px rgba(0,0,0,.85);
  --sh-card:inset 0 1px 0 #fff,0 3px 0 #d2c197,0 12px 22px -16px rgba(40,25,0,.6);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,select{font-family:inherit}
b,strong{font-weight:700}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:800;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}

/* 장면 배경: 단계마다 바뀌는 그림 + 어둡게 덮는 막 */
#scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#1d2c4a,#0b1222 70%)}
#scene i{position:absolute;inset:-10px;background:center/cover no-repeat;opacity:0;transition:opacity 1.2s ease}
#scene i.on{opacity:1}
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 95% at 50% 10%,rgba(9,14,28,.2) 0%,rgba(9,14,28,.5) 60%,rgba(5,8,17,.84) 100%)}
body[data-screen="title"] #scene::after{background:linear-gradient(180deg,rgba(9,14,28,.18) 0%,rgba(9,14,28,.38) 38%,rgba(6,10,20,.8) 78%,rgba(5,8,17,.92) 100%)}
body[data-screen="ending"] #scene::after{background:radial-gradient(130% 95% at 50% 0%,rgba(9,14,28,.35),rgba(6,10,20,.85) 75%)}

/* 현수막 */
.banner{position:relative;color:#f6e7c4;font-family:var(--f-display);font-weight:900;letter-spacing:-.01em;text-align:center;padding:12px 48px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 7px),radial-gradient(120% 170% at 50% -25%,#7d3440 0%,#56202a 46%,#331219 100%);
  border:1.5px solid var(--gold);border-radius:14px;
  box-shadow:inset 0 0 0 1px rgba(30,6,10,.9),inset 0 0 0 5px rgba(0,0,0,0),inset 0 1px 0 rgba(255,225,180,.3),inset 0 -16px 26px -16px rgba(0,0,0,.55),0 0 0 1px rgba(10,3,5,.6),0 16px 32px -16px rgba(0,0,0,.85);
  text-shadow:0 2px 0 rgba(20,4,8,.55)}
.banner .bt{display:inline-block;background:linear-gradient(180deg,#fff6da 0%,#f3d78f 52%,#c9973a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 rgba(20,4,8,.6)) drop-shadow(0 0 14px rgba(243,215,143,.18))}
.banner::before,.banner::after{content:"";position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translateY(-50%);
  background:radial-gradient(circle at 35% 30%,#fff5cf,#e3bd62 45%,#7e5c18 100%);box-shadow:0 1px 2px rgba(0,0,0,.7)}
.banner::before{left:15px}.banner::after{right:15px}
.banner small{display:block;font-weight:700;font-size:12px;letter-spacing:.16em;color:#d9c79e;text-shadow:0 1px 0 rgba(0,0,0,.4);margin-bottom:2px}
.counter{position:relative;margin-bottom:16px;padding:8px 40px;text-align:center;font-family:var(--f-display);font-weight:900;font-size:16px;color:#1c1405;letter-spacing:-.01em;
  background:repeating-linear-gradient(-45deg,rgba(60,40,0,.08) 0 10px,transparent 10px 20px),linear-gradient(180deg,#f3d27a,#d3a33d);
  border:1px solid #6e5014;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 #6e5014,0 10px 18px -10px rgba(0,0,0,.6)}
.counter::before,.counter::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;transform:translateY(-50%);background:radial-gradient(circle at 35% 30%,#8a8a8a,#2b2b2b);box-shadow:0 1px 1px rgba(255,255,255,.5)}
.counter::before{left:12px}.counter::after{right:12px}

/* 타이틀 */
.title-wrap{max-width:900px;margin:0 auto;padding:52px 18px 64px;display:flex;flex-direction:column;gap:24px}
.title-banner{font-size:clamp(46px,10vw,100px);line-height:1.02;padding:30px 58px 26px;border-width:2px}
.title-banner small{font-size:clamp(11px,2vw,14px);margin-bottom:10px}
.lede{font-size:18px;max-width:60ch;margin:0 auto;color:#f5ecd9;text-align:center;line-height:1.75;text-shadow:0 2px 14px rgba(0,0,0,.85),0 1px 2px rgba(0,0,0,.8)}
.title-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media (max-width:720px){.title-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.dex{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.dex-card{min-height:68px}}
.sheet{background:linear-gradient(180deg,#fffdf7,#f5efe1);border:1px solid var(--gold-line);border-radius:16px;padding:20px;box-shadow:var(--sh-panel)}
.sheet h3{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--gold-lo);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sheet h3::before{content:"";width:7px;height:7px;background:linear-gradient(135deg,var(--gold-hi),var(--gold));transform:rotate(45deg);flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:700;font-size:14px}
.field input{width:100%;min-width:0;font:600 17px var(--f-body);padding:12px 14px;border:1px solid #c7b58a;border-radius:10px;background:#fff;color:var(--ink);box-shadow:inset 0 2px 4px rgba(60,40,0,.13)}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 2px 4px rgba(60,40,0,.13),0 0 0 3px rgba(201,161,74,.35)}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.howto li::marker{color:var(--gold);font-weight:800}
.dex-head{display:flex;align-items:center;gap:12px;margin:-2px 0 14px}
.dex-head .bar{flex:1;height:8px}
.dex-head .bar i{background:linear-gradient(180deg,#f3d78f,#b98a33)}
.dex-head span{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dex-card{position:relative;min-height:74px;padding:10px 12px 11px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden}
.dex-no{position:absolute;top:8px;left:12px;font-size:11px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.dex-k{font-size:10px;font-weight:800;letter-spacing:.12em}
.dex-nm{font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.dex-card.locked{background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px),linear-gradient(160deg,#283a60,#141f37);border:1px solid rgba(201,161,74,.4);color:#b9b2a2;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 #0b1325,0 10px 18px -12px rgba(0,0,0,.6)}
.dex-card.locked .dex-no{color:rgba(243,215,143,.75)}
.dex-card.locked .dex-k{color:rgba(243,215,143,.55)}
.dex-card.locked .dex-nm{color:#d6cfbf;font-weight:600;font-size:13px}
.dex-lock{position:absolute;top:9px;right:11px;width:16px;height:18px;color:rgba(243,215,143,.7)}
.dex-card.got{background:linear-gradient(160deg,#fffdf6,#f3e5bf);border:1px solid var(--gold);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 3px 0 #c6ab6a,0 10px 18px -12px rgba(40,25,0,.55)}
.dex-card.got .dex-no{color:var(--gold-lo)}
.dex-card.got .dex-k{color:var(--banner)}
.dex-ok{position:absolute;top:8px;right:9px;width:19px;height:19px;filter:drop-shadow(0 1px 1px rgba(60,10,16,.35))}

/* 입체 버튼 */
.btn{--b1:#30497a;--b2:#17243f;--edge:#0a1224;--tx:#fff3d6;
  position:relative;font:700 15px/1.25 var(--f-body);letter-spacing:-.01em;color:var(--tx);
  background:linear-gradient(180deg,var(--b1),var(--b2));border:1px solid var(--edge);border-radius:11px;padding:11px 20px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.2),0 4px 0 var(--edge),0 9px 16px -6px rgba(0,0,0,.55);
  text-shadow:0 1px 0 rgba(0,0,0,.35);transition:transform .08s ease,box-shadow .08s ease,filter .15s ease}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.2),0 1px 0 var(--edge),0 3px 8px -4px rgba(0,0,0,.5)}
.btn.red{--b1:#a8414c;--b2:#6f1f2b;--edge:#3b0f17;--tx:#fff1dc}
.btn.ghost{--b1:#fffdf7;--b2:#ebe1ca;--edge:#a8956a;--tx:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.75)}
.btn.sm{font-size:13px;padding:7px 13px;border-radius:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.15),0 3px 0 var(--edge),0 6px 12px -6px rgba(0,0,0,.5)}
.btn.sm:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 0 var(--edge)}
.btn[aria-pressed="true"]{transform:translateY(2px);filter:brightness(.97);box-shadow:inset 0 2px 6px rgba(0,0,0,.3),0 1px 0 var(--edge),0 3px 6px -4px rgba(0,0,0,.5)}
.btn.ghost[aria-pressed="true"]{--b1:#f8e3a2;--b2:#d9ad4f;--edge:#7e5c18;--tx:#2a1d02}
.btn.red[aria-pressed="true"]{--b1:#6f1f2b;--b2:#56171f}
.btn:disabled{cursor:not-allowed;opacity:.55;filter:saturate(.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 var(--edge)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* 게임 헤더 */
.top{padding:16px 16px 0;max-width:1400px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.top .banner{font-size:clamp(22px,3.4vw,32px);padding:9px 48px}
.top-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top-row .banner{flex:1}
.top-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.snd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.snd input[type=range]{width:96px;accent-color:var(--gold)}
.np{font-size:12.5px;color:#eadfc6;font-weight:600;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.theme-card .row{margin-bottom:8px}
.theme-meta{font-size:13px;color:var(--muted)}
.theme-card .np{color:var(--muted);text-shadow:none}

/* 결재란 */
.gj{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:linear-gradient(180deg,#fffdf7,#f3ecda);border:1px solid var(--gold);border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(8,12,22,.5),0 14px 28px -18px rgba(0,0,0,.85)}
.gj-cell{border-left:1px solid #d6c8a3;display:flex;flex-direction:column;min-width:0}
.gj-cell:first-child{border-left:none}
.gj-label{font-size:12px;font-weight:700;text-align:center;padding:5px 2px;color:#e9dec4;background:linear-gradient(180deg,#273a60,#17233d);border-bottom:1px solid var(--gold-lo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gj-box{height:52px;display:grid;place-items:center;position:relative}
.gj-cell.now .gj-box{background:repeating-linear-gradient(-45deg,rgba(232,173,0,.17) 0 8px,transparent 8px 16px)}
.gj-cell.now .gj-label{background:linear-gradient(180deg,#f8e09a,#d4a644);color:#2a1d02}
.gj-now{font-size:11px;font-weight:800;color:var(--gold-lo)}
.stamp{width:42px;height:42px;border:3px solid var(--banner);border-radius:50%;color:var(--banner);font-family:var(--f-display);font-weight:900;font-size:13px;display:grid;place-items:center;transform:rotate(-14deg);opacity:.9;background:rgba(179,32,45,.05);box-shadow:inset 0 0 0 2px rgba(179,32,45,.18)}

/* 보드 */
.board{display:grid;grid-template-columns:270px minmax(0,1fr) 310px;gap:18px;padding:18px 16px 40px;max-width:1400px;margin:0 auto;width:100%;align-items:start}
@media (max-width:1120px){.board{grid-template-columns:250px minmax(0,1fr)}.feed{grid-column:1/-1}}
@media (max-width:760px){.board{grid-template-columns:minmax(0,1fr)}}
.panel{background:linear-gradient(180deg,#fffdf7,#f4eee0);border:1px solid var(--gold-line);border-radius:16px;padding:16px;box-shadow:var(--sh-panel)}
.panel-title{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--gold-lo);margin:0 0 10px}

/* 수첩: 게이지 */
.status{display:flex;flex-direction:column;gap:15px}
.when{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.02em}
.when-sub{font-size:13px;color:var(--muted)}
.g{display:flex;flex-direction:column;gap:5px}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.g-name{font-size:13px;font-weight:700}
.g-val{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.g-val small{font-size:12px;font-weight:700;margin-left:2px;color:var(--muted)}
.bar{position:relative;height:10px;background:linear-gradient(180deg,#d9cfb8,#ece5d4);border-radius:99px;box-shadow:inset 0 1px 2px rgba(40,28,0,.4),0 1px 0 rgba(255,255,255,.85)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(180deg,#4f70ad,#1c2e54);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--banner);box-shadow:0 0 0 1px rgba(255,255,255,.85)}
.g-note{font-size:12px;color:var(--muted)}
.g.warn .g-val{color:var(--bad)}
.g.warn .bar i{background:linear-gradient(180deg,#e2554f,#9c1d1a)}
.secret{border:1px dashed rgba(243,217,143,.65);padding:10px 12px;border-radius:12px;color:#efe6d2;
  background:repeating-linear-gradient(45deg,#1a2640 0 8px,#202e4c 8px 16px);box-shadow:inset 0 2px 10px rgba(0,0,0,.45)}
.secret .g-name{color:var(--gold-hi)}
.secret .g-val{font-size:18px;letter-spacing:.25em;color:var(--gold-hi)}
.secret .g-val.sealed{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;letter-spacing:.08em;padding:3px 10px 3px 8px;border:1px solid rgba(243,217,143,.55);border-radius:99px;background:rgba(243,217,143,.08)}
.secret .g-val.sealed svg{width:12px;height:14px}
.secret .g-note{color:#cbc4b4}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:linear-gradient(180deg,#fff,#faf6ec);border:1px solid #e0d4b6;padding:9px 10px;border-radius:12px;box-shadow:inset 0 1px 0 #fff,0 2px 0 #e0d4b6}
.mini .g-val{font-size:20px}
.dots{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.dot{aspect-ratio:1;border-radius:50%;border:1px solid #cdbf9e;background:#fbf8f0}
.dot.on{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 50%),var(--c);border-color:var(--c)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:9px;font-size:11.5px;font-weight:600}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

/* 무대 */
.stage{background:linear-gradient(180deg,#fffdf8,#f5efe2);border:1px solid var(--gold-line);border-radius:18px;padding:22px;min-height:420px;position:relative;box-shadow:var(--sh-panel)}
.stage::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,161,74,.3);border-radius:13px;pointer-events:none}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--banner)}
.stage-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;padding-bottom:16px;margin-bottom:18px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--gold),rgba(201,161,74,.15)) 1}
.stage-head h2{font-size:25px;margin-top:3px}
.stage-head p{margin:5px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:12.5px;font-weight:700;padding:5px 11px;border:1px solid #cdbb8f;border-radius:99px;background:linear-gradient(180deg,#fffefa,#f1e7cf);white-space:nowrap;box-shadow:inset 0 1px 0 #fff,0 2px 0 #cdbb8f}
.chip.hz{background:linear-gradient(180deg,#f3d27a,#d3a33d);border-color:#6e5014;color:#1c1405;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 #6e5014}
.ap{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.ap i{width:18px;height:18px;border-radius:50%;border:1.5px solid #7a2a33;display:inline-block;background:#f4ebe4;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.ap i.full{background:radial-gradient(circle at 35% 30%,#f6c6bf 0,#b8434e 40%,#5e1720 100%);box-shadow:0 0 8px rgba(184,67,78,.45),inset 0 -1px 2px rgba(0,0,0,.3)}
.goal{border:1px solid var(--gold-line);background:linear-gradient(180deg,#fffefb,#faf3e3);border-radius:14px;padding:14px 16px;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:22px;box-shadow:inset 0 1px 0 #fff,0 10px 20px -16px rgba(40,25,0,.6)}
.checks{display:flex;flex-direction:column;gap:6px;font-size:14px}
.ck{display:flex;gap:8px;align-items:baseline}
.ck b{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid #b9a77e;border-radius:6px;background:#fff;font-size:12px;flex:none;transform:translateY(4px);box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.ck.ok b{background:linear-gradient(180deg,#3f9a63,#256a40);border-color:#1e5734;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.ck em{font-style:normal;color:var(--muted)}
.sec{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--gold-lo);margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid rgba(201,161,74,.32);display:flex;justify-content:space-between;align-items:center}
.sec span:first-child::before{content:"";display:inline-block;width:7px;height:7px;background:linear-gradient(135deg,var(--gold-hi),var(--gold));transform:rotate(45deg);margin-right:8px;vertical-align:2px}
.sec span:last-child{font-weight:600;letter-spacing:0;color:var(--muted);font-size:12px}
img.av{object-fit:cover;display:block;padding:0;border:2px solid var(--c)}
.mport{width:72px;height:72px;border-radius:12px;object-fit:cover;border:2px solid var(--c);flex:none;box-shadow:0 0 0 2px #fff,0 6px 14px -6px rgba(0,0,0,.5)}
.fac-top{display:flex;gap:12px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.3)}
.av.sm{width:28px;height:28px;font-size:12px}

/* 입체 카드 버튼: 업무·선택지·협상 카드 */
.spec,.choice,.ncard{position:relative;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fffefb,#f5ecd8);border:1px solid #d6c59c;border-radius:13px;box-shadow:var(--sh-card);
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.spec:hover:not(:disabled),.choice:hover:not(:disabled),.ncard:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:inset 0 1px 0 #fff,0 5px 0 #c3a865,0 18px 26px -16px rgba(40,25,0,.6)}
.spec:active:not(:disabled),.choice:active:not(:disabled),.ncard:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff,0 1px 0 #c3a865,0 4px 8px -6px rgba(40,25,0,.5)}
.spec:disabled,.choice:disabled{opacity:.48;cursor:not-allowed;filter:saturate(.4);box-shadow:inset 0 1px 0 #fff,0 1px 0 #d2c197}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:24px}
.spec{padding:12px 14px 12px 16px;gap:3px}
.spec::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,#4f70ad,#1c2e54)}
.spec strong{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.spec span{font-size:12.5px;color:var(--muted)}
.spec .fx{color:var(--ink);font-weight:700}
.spec .warn{color:var(--bad);font-weight:700}
.demand{border:1px solid #dcbd84;border-left:5px solid #8a5a14;background:linear-gradient(180deg,#fffaf0,#f8ecd2);border-radius:14px;padding:12px 16px;margin:-8px 0 22px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 1px 0 #fff,0 10px 20px -16px rgba(40,25,0,.6)}
.dm-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dm-tag{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:#8a5a14}
.dm-row{display:flex;gap:12px;align-items:center}
.dm-face{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.3)}
.dm-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dm-main > b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.dm-main > span{font-size:13.5px}
.demand .bar i{background:linear-gradient(180deg,#d1a24c,#8a5a14)}

/* 이벤트 카드 */
.ev{max-width:660px;margin:10px auto;background:linear-gradient(180deg,#fffefb,#faf5ea);border:1px solid #dacda9;border-top:6px solid var(--tc);padding:24px;border-radius:16px;box-shadow:inset 0 1px 0 #fff,0 20px 38px -22px rgba(30,20,0,.7);display:flex;flex-direction:column;gap:14px}
.ev-type{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--tc);display:inline-flex;align-items:center;gap:7px}
.ev-type::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.ev h2{font-size:25px}
.ev p{margin:0;font-size:15.5px;line-height:1.7;max-width:62ch}
.who{display:flex;gap:12px;align-items:center;font-size:13.5px;color:var(--muted);font-weight:700}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{padding:13px 16px 13px 18px;gap:2px}
.choice::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;border-radius:0 4px 4px 0;background:var(--tc,var(--gold))}
.choice strong{font-size:15px;font-weight:800;letter-spacing:-.01em}
.choice span{font-size:12.5px;color:var(--muted)}
.result{background:linear-gradient(180deg,#fff9e4,#fcefc9);border:1px solid #ead08a;border-left:5px solid var(--hazard);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.65}

/* 모달 */
.overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(14,22,40,.55),rgba(4,7,15,.84));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{background:linear-gradient(180deg,#fffdf8,#f4eee0);border:1px solid var(--gold);border-radius:20px;max-width:660px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 20px);overflow:auto;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.5),0 32px 64px -20px rgba(0,0,0,.9)}
.modal h2{font-size:22px}
.modal p{margin:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.ncard{padding:13px 14px;gap:4px;min-height:96px}
.ncard .k{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--banner)}
.ncard strong{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.ncard span{font-size:12.5px;color:var(--muted)}
.hint{font-size:13px;background:#fffaf0;border:1px dashed #cdb880;border-radius:10px;padding:9px 12px}
.hint b{color:var(--gold-lo)}
.quote{font-size:17px;font-weight:600;line-height:1.6;padding:15px 18px;background:#fff;border:1px solid #e0d2ae;border-radius:16px;position:relative;box-shadow:inset 0 1px 0 #fff,0 8px 18px -12px rgba(40,25,0,.45)}
.delta{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;letter-spacing:-.02em}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}

/* 총회 */
.hall{display:flex;flex-direction:column;gap:16px}
.hall .banner{font-size:clamp(18px,2.6vw,26px)}
.agenda{text-align:center;font-weight:800;font-size:15.5px}
.bubble{display:flex;gap:12px;align-items:flex-start}
.bubble p{margin:0;background:#fff;border:1px solid #d9cba8;border-radius:16px;padding:12px 16px;font-size:15.5px;font-weight:600;line-height:1.6;box-shadow:inset 0 1px 0 #fff,0 8px 18px -12px rgba(40,25,0,.45)}
.vote{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:18px;align-items:center}
@media (max-width:620px){.vote{grid-template-columns:1fr}}
.vote .dots{gap:4px}
.vote .dot.yes{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),transparent 50%),var(--agree);border-color:var(--agree)}
.vote .dot.no{background:#cfc6b3;border-color:#cfc6b3}
.tally{display:flex;flex-direction:column;gap:6px}
.tally .big{font-family:var(--f-display);font-weight:900;font-size:38px;line-height:1;letter-spacing:-.03em}
.bigstamp{width:120px;height:120px;border:5px solid var(--banner);color:var(--banner);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:34px;transform:rotate(-14deg);margin:6px auto;background:rgba(179,32,45,.05);box-shadow:inset 0 0 0 3px rgba(255,253,248,.9),inset 0 0 0 5px rgba(179,32,45,.35);animation:thunk .35s ease-out}
.bigstamp.fail{border-color:var(--ink);color:var(--ink);background:rgba(24,34,58,.05);box-shadow:inset 0 0 0 3px rgba(255,253,248,.9),inset 0 0 0 5px rgba(24,34,58,.3)}
@keyframes thunk{from{transform:rotate(-14deg) scale(1.8);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.tip{border:1px solid #e1cf9f;border-left:5px solid var(--gold);background:linear-gradient(180deg,#fffcf3,#fbf2dc);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tip .law{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--gold-lo)}
.tip p{margin:0;font-size:14.5px;line-height:1.65}
.tip p.sub{color:var(--muted);font-size:13.5px}
.calc{width:100%;border-collapse:collapse;font-size:14px}
.calc td{padding:6px 0;border-bottom:1px dotted #cdbf9e}
.calc td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* 피드: 가람일보 · 단톡방 */
.feed{display:flex;flex-direction:column;gap:16px}
.paper{background:linear-gradient(180deg,#fdfbf5,#f6f1e5);border:1px solid #d9cfb5;border-radius:16px;padding:14px 16px;box-shadow:var(--sh-panel)}
.mast{font-family:var(--f-news);font-weight:900;font-size:26px;letter-spacing:-.04em;border-bottom:3px double var(--ink);padding-bottom:5px;display:flex;justify-content:space-between;align-items:baseline}
.mast small{font-size:11.5px;font-weight:700;letter-spacing:0;color:var(--muted)}
.headline{font-family:var(--f-news);font-weight:800;font-size:19px;line-height:1.4;letter-spacing:-.025em;margin:10px 0 8px}
.olds{list-style:none;margin:0;padding:9px 0 0;border-top:1px solid #d9cfb5;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.olds li::before{content:"·";margin-right:5px;color:var(--gold)}
.chat{background:#b9c8d6;border:1px solid var(--gold-line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-panel)}
.chat-head{background:linear-gradient(180deg,#273a60,#152139);color:#f2e8d2;padding:10px 14px;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;border-bottom:1px solid var(--gold-lo)}
.chat-head .num{color:var(--gold-hi)}
.chat-body{height:430px;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.chat-body{height:300px}}
.msg{display:flex;gap:7px;align-items:flex-start}
.msg .nm{font-size:11.5px;font-weight:700;color:#33404e;margin-bottom:2px}
.msg .tx{background:#fff;border-radius:3px 12px 12px 12px;padding:7px 11px;font-size:13.5px;line-height:1.5;max-width:230px;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.msg.me{flex-direction:row-reverse}
.msg.me .tx{background:#ffe75e;border-radius:12px 3px 12px 12px}
.msg.me .nm{text-align:right}
.msg.sys{justify-content:center}
.msg.sys .tx{background:rgba(24,34,58,.22);color:#18223a;font-size:12px;border-radius:10px;max-width:none;text-align:center;box-shadow:none}

/* 엔딩 */
.end-wrap{max-width:880px;margin:0 auto;padding:34px 16px 64px;display:flex;flex-direction:column;gap:18px}
.front{background:linear-gradient(180deg,#fdfbf5,#f5efe2);border:1px solid #d9cfb5;border-radius:16px;padding:26px 30px;box-shadow:var(--sh-panel)}
.front .mast{font-size:38px}
.front .kicker{font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--banner);margin-top:14px}
.front h1{font-family:var(--f-news);font-weight:900;font-size:clamp(26px,4.4vw,40px);line-height:1.25;letter-spacing:-.035em;margin:6px 0 12px}
.front p{font-size:16.5px;line-height:1.8;margin:0;max-width:64ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:linear-gradient(180deg,#fffdf7,#f4eee0);border:1px solid var(--gold-line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh-panel)}
.stat .g-val{font-size:28px}
.type{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.type .stamp{width:84px;height:84px;font-size:15px;line-height:1.1;text-align:center;border-width:4px}
.end-wrap > .g-note{color:#d9cfba;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* 나레이션 */
.say-btn{font:700 12.5px var(--f-body);background:linear-gradient(180deg,#fffefa,#eee4cc);border:1px solid #c6b48a;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink);white-space:nowrap;box-shadow:inset 0 1px 0 #fff,0 2px 0 #b9a676,0 5px 10px -6px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
.say-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff,0 0 0 #b9a676}
.say-btn[aria-pressed="true"]{background:linear-gradient(180deg,#2c4270,#17243f);color:var(--gold-hi);border-color:#0a1224;transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(0,0,0,.45),0 1px 0 #0a1224}
.ev-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
[data-say]{transition:background-color .25s, box-shadow .25s;border-radius:4px}
[data-say].is-reading{background-color:var(--hazard-tint);box-shadow:-5px 0 0 var(--hazard)}
.result[data-say].is-reading{box-shadow:inset 0 0 0 2px var(--hazard)}
.nset{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dotted #cdbf9e}
.nset-l{font-weight:700;font-size:14px}
.castlist{list-style:none;margin:0;padding:4px 12px;max-height:240px;overflow:auto;border:1px solid #dccfae;background:#fff;border-radius:12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.castlist li{display:grid;grid-template-columns:8.2em 5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dotted #d9cfb5}
.castlist li:last-child{border-bottom:none}
.castlist .cn{font-weight:800}
.castlist .cm{color:var(--muted);font-size:12px}
.castlist .cv{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.castlist .cv em{font-style:normal;font-weight:500;color:var(--muted);font-size:12px}
.castlist .say-btn{padding:3px 10px}
@media (max-width:520px){.castlist li{grid-template-columns:minmax(0,1fr) auto;row-gap:0}.castlist .cm{grid-row:2;grid-column:1}.castlist .cv{grid-column:1;grid-row:3}.castlist .say-btn{grid-row:1/4;grid-column:2}}
.nset select{font:600 14px var(--f-body);padding:7px 9px;border:1px solid #c6b48a;border-radius:9px;background:linear-gradient(180deg,#fff,#f6f0e2);color:var(--ink);max-width:60%;box-shadow:inset 0 1px 0 #fff,0 2px 0 #d2c197}

/* 요약 막대(모바일 전용) */
.hud{display:none;grid-column:1/-1;position:sticky;top:6px;z-index:6;color:#fff;grid-template-columns:auto auto auto auto;justify-content:space-between;align-items:end;gap:8px;padding:9px 14px;
  background:linear-gradient(180deg,rgba(34,51,86,.97),rgba(15,24,44,.97));border:1px solid rgba(243,217,143,.6);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 24px -10px rgba(0,0,0,.85)}
.hud span{display:block;font-size:11px;color:#d6ccb4;font-weight:700;white-space:nowrap}
.hud b{display:block;font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;white-space:nowrap;color:#fff6e0;letter-spacing:-.02em}
.hud .warn b{color:#ff9b8f}
.hud .ap{gap:4px;margin-top:3px}
.hud .ap i{width:14px;height:14px;border-color:#d98a8f;background:rgba(255,255,255,.1)}
.hud .ap i.full{background:radial-gradient(circle at 35% 30%,#f9d6cf,#d0656e 45%,#8a2a35)}
.gj-label .short{display:none}

/* 모바일 */
@media (max-width:760px){
  .title-wrap{padding:28px 14px 48px;gap:18px}
  .title-banner{padding:22px 38px 18px}
  .lede{font-size:16px}
  .top{padding:10px 12px 0;gap:10px}
  .top .banner{font-size:22px;padding:7px 36px}
  .banner::before{left:11px}.banner::after{right:11px}
  .top-ctrl{width:100%;justify-content:space-between;gap:6px;flex-wrap:nowrap}
  .snd{gap:6px;flex-wrap:nowrap}
  .top-ctrl .np{display:none}
  .snd input[type=range]{display:none}
  .btn.sm{padding:7px 10px}
  .gj-label .full{display:none}
  .gj-label .short{display:inline}
  .gj-label{font-size:11px;padding:4px 1px}
  .gj-box{height:40px}
  .gj .stamp{width:32px;height:32px;font-size:11px;border-width:2px}
  .gj-now{font-size:10px}
  .board{padding:12px 12px 32px;gap:12px}
  .hud{display:grid}
  .stage::before{inset:5px;border-radius:12px}
  .status{order:2}
  .feed{order:3}
  .stage-head{padding-bottom:12px;margin-bottom:14px}
  .stage-head h2{font-size:21px}
  .stage-head .chips .ap{display:none}
  .counter{font-size:14px;padding:7px 32px}
  .goal{padding:12px;gap:12px;margin-bottom:18px}
  .goal .btn{width:100%}
  .sec{font-size:12px}
  .specs{grid-template-columns:minmax(0,1fr);margin-bottom:18px}
  .ev{padding:18px 16px;margin:4px 0;gap:12px}
  .ev h2{font-size:21px}
  .ev p{font-size:15px}
  .choice{padding:12px 14px 12px 17px}
  .hall .banner{font-size:19px;padding:8px 36px}
  .bubble p{font-size:15px}
  .bigstamp{width:96px;height:96px;font-size:28px}
  .chat-body{height:320px}
  .modal{padding:18px 16px;gap:12px;border-radius:18px}
  .modal h2{font-size:19px}
  .ncard{min-height:0;padding:11px 13px}
  .end-wrap{padding:22px 12px 48px;gap:14px}
  .front{padding:20px 18px}
  .front .mast{font-size:30px}
  .front p{font-size:15.5px}
  .type{grid-template-columns:1fr}
  .type .stamp{width:72px;height:72px;font-size:13px}
}
/* ── 한 화면 레이아웃 v2: 무대는 안쪽에서만 스크롤, 조합원은 작은 초상화 카드 ── */
.stage{padding:0;display:flex;flex-direction:column}
.stage-in{padding:20px 22px;flex:1}
.stage-foot{position:sticky;bottom:0;z-index:4;display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px 20px 14px;border-top:1px solid rgba(201,161,74,.35);background:linear-gradient(180deg,rgba(247,241,229,.94),#f5efe2 45%);border-radius:0 0 18px 18px}
.foot-note{margin-right:auto;font-size:12.5px;font-weight:600;color:var(--muted)}
.counter{margin-bottom:12px;padding:5px 36px;font-size:14px}
.stage-head{padding-bottom:10px;margin-bottom:14px}
.stage-head h2{font-size:22px;margin-top:2px}
.stage-head p{margin:3px 0 0;font-size:13px;line-height:1.5}
.goal{padding:10px 14px;gap:12px;margin-bottom:14px}
.checks{flex-direction:row;flex-wrap:wrap;gap:5px 18px;font-size:13.5px}
.sec{margin:0 0 9px;padding-bottom:5px}
.facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;margin-bottom:16px}
.fac{position:relative;display:grid;grid-template-columns:66px minmax(0,1fr);gap:11px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  padding:9px 26px 9px 12px;background:linear-gradient(180deg,#fffefb,#f5ecd8);border:1px solid #d9cba6;border-radius:13px;box-shadow:var(--sh-card);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.fac::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.fac::after{content:"›";position:absolute;right:10px;top:50%;transform:translateY(-55%);font-size:22px;font-weight:800;line-height:1;color:var(--gold)}
.fac:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold);box-shadow:inset 0 1px 0 #fff,0 5px 0 #c3a865,0 18px 26px -16px rgba(40,25,0,.6)}
.fac:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 #fff,0 1px 0 #c3a865,0 4px 8px -6px rgba(40,25,0,.5)}
.fac:disabled{cursor:not-allowed;opacity:.6;filter:saturate(.5)}
.fac-pic{position:relative;display:block;width:66px;height:66px;border-radius:11px;overflow:hidden;background:var(--c);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--c),0 4px 10px -3px rgba(0,0,0,.4)}
.fac-pic img{width:100%;height:100%;object-fit:cover;display:block}
.fac-own{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:10.5px;font-weight:800;color:#fff4dc;padding:9px 0 2px;background:linear-gradient(180deg,transparent,rgba(8,14,28,.85))}
.fac-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.fac-name{display:block;font-weight:800;font-size:14.5px;line-height:1.25;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fac-role,.fac-want{display:block;font-size:11.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fac-role{color:var(--muted)}
.fac-want b{color:var(--gold-lo);font-weight:800;margin-right:2px}
.stance{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;margin-top:3px}
.stance .bar{display:block;flex:1;height:7px}
.stance .bar i{background:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c))}
.fac-tag{position:absolute;z-index:2;left:6px;top:-7px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:linear-gradient(180deg,#f8e09a,#d4a644);color:#2a1d02;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.fac-tag.dm{background:linear-gradient(180deg,#b8434e,#7a2430);color:#fff3e0}
.specs{grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px;margin-bottom:4px}
.spec{padding:9px 12px 9px 15px;gap:1px}
.spec::before{top:10px;bottom:10px}
.spec strong{font-size:13.5px}
.spec span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demand{padding:9px 14px;margin:-4px 0 14px;gap:5px}
.dm-face{width:40px;height:40px}
.dm-main{gap:3px}
.dm-main > b{font-size:14px}
.dm-main > span{font-size:12.5px}
.demand .g-note{margin:0;font-size:11.5px}
.burden{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#e1cf9f;border:1px solid #e1cf9f;border-radius:12px;overflow:hidden;margin:-4px 0 14px}
.burden div{background:#fffaf0;padding:7px 11px;display:flex;flex-direction:column;gap:1px;min-width:0}
.burden span{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burden b{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.burden .tot{background:linear-gradient(180deg,#fff3d6,#f6e2b0)}
.burden .tot b{color:var(--banner)}
.status{gap:11px}
.when{font-size:19px}
.g-val{font-size:21px}
.mini .g-val{font-size:18px}
.secret{padding:8px 11px}
.title-wrap{max-width:1060px;padding:30px 18px 44px;gap:18px}
.title-banner{font-size:clamp(40px,7.4vw,86px);padding:22px 56px 20px}
.lede{font-size:17px;line-height:1.7}
.title-grid{grid-template-columns:1fr 1.1fr;gap:16px;align-items:start}
.title-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet{padding:16px 18px}
.sheet h3{margin-bottom:10px}
.field{margin-bottom:12px}
.howto{gap:6px;font-size:13.5px}
.dex-card{min-height:62px}
@media (min-width:761px){
  .top{padding:10px 16px 0;gap:8px}
  .top-row{gap:12px}
  .top .banner{font-size:21px;padding:5px 46px 6px;border-radius:12px}
  .top .banner small{font-size:10.5px;margin-bottom:0;letter-spacing:.14em}
  .gj{border-radius:11px}
  .gj-cell{flex-direction:row}
  .gj-label{flex:1;display:flex;align-items:center;justify-content:center;border-bottom:none;border-right:1px solid var(--gold-lo);padding:4px 6px}
  .gj-box{height:36px;width:46px;flex:none}
  .gj .stamp{width:28px;height:28px;font-size:10px;border-width:2px}
  .gj-now{font-size:10px}
  .board{padding:12px 16px 18px;gap:14px}
}
@media (min-width:761px) and (max-width:1299px){.gj-label .full{display:none}.gj-label .short{display:inline}}
/* 넓고 충분히 높은 화면: 게임 화면 전체를 창 높이에 맞추고 칸마다 안쪽에서 스크롤 */
@media (min-width:1180px) and (min-height:620px){
  body[data-screen="game"]{overflow:hidden}
  body[data-screen="game"] #app{height:100vh;height:100dvh;display:flex;flex-direction:column}
  body[data-screen="game"] .top{flex:none}
  body[data-screen="game"] .board{flex:1;min-height:0;grid-template-columns:258px minmax(0,1fr) 300px;align-items:stretch;padding:10px 16px 14px}
  body[data-screen="game"] .status{min-height:0;overflow-y:auto}
  body[data-screen="game"] .stage{min-height:0}
  body[data-screen="game"] .stage-in{min-height:0;overflow-y:auto;padding:18px 22px}
  body[data-screen="game"] .feed{min-height:0;gap:12px}
  body[data-screen="game"] .feed .paper{flex:none}
  body[data-screen="game"] .feed .chat{flex:1;min-height:0}
  body[data-screen="game"] .feed .chat-body{height:auto;flex:1;min-height:0}
  .status,.stage-in,.chat-body{scrollbar-width:thin;scrollbar-color:rgba(126,92,24,.4) transparent}
}
@media (max-width:760px){
  .stage{order:1;scroll-margin-top:66px;border-radius:16px}
  .stage-in{padding:16px 14px}
  .stage-foot{padding:10px 12px 12px;border-radius:0 0 16px 16px}
  .stage-foot .btn{flex:1;padding:14px}
  .foot-note{display:none}
  .facs{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:16px}
  .fac{grid-template-columns:48px minmax(0,1fr);gap:8px;padding:8px 18px 8px 10px}
  .fac::after{right:6px;font-size:18px}
  .fac-pic{width:48px;height:48px;border-radius:9px}
  .fac-own{font-size:9.5px;padding-top:6px}
  .fac-name{font-size:13px}
  .fac-role{font-size:10.5px}
  .fac-want{display:none}
  .burden{grid-template-columns:1fr 1fr}
  .title-grid{grid-template-columns:minmax(0,1fr)}
}

/* ── v2.1: 머리글 두 칸, 요구 패널 한 줄, 결재란 도장 안쪽으로 ── */
.stage-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start;padding-bottom:12px;margin-bottom:14px}
.stage-head p{max-width:none}
.sh-l .chips{margin-top:8px}
.stage-head .goal{margin:0;flex-direction:column;align-items:stretch;gap:8px;padding:10px 14px 12px}
.goal-t{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--gold-lo)}

@media (min-width:761px){

function demandDue(){ return S.chapter >= 2 && !!DEMANDS[S.chapter] && S.cd.dmAt != null && S.turn >= S.cd.dmAt && !S.cd.dmSeen; }
function openDemand(){
  const d = DEMANDS[S.chapter]; S.cd.dmSeen = true;
  S.cd.dmPlan = {need: clamp(Math.round(S.st[d.fid] + d.up - (d.easy && d.easy() ? 8 : 0)), d.lo, d.hi)};
  if (!S.usedEvents.includes('dm' + S.chapter)) S.usedEvents.push('dm' + S.chapter);
  return 'dm' + S.chapter;
}
function demandCheck(){
  const m = S.cd && S.cd.demand; if (!m || S.st[m.fid] < m.need) return '';
  S.cd.demand = null; S.cd.dmDone = 'ok'; const t = DEMANDS[m.ch].ok(); fixAll(); return t;
}
function dmNote(t){ return t ? `<div class="result" style="margin-top:10px"><b>✓ 요구 해결</b> · ${t}</div>` : ''; }
function attendance(){ const met = S.cd.met || {}; return Math.min(200, Math.round(ORDER.reduce((a, k) => a + F[k].owners * (met[k] ? .9 : .3), 0) + (S.cd.evote ? 30 : 0))); }
function asmTwoThirds(kind){ return kind === 4 && (S.flags.costUp || 0) >= 10; }
function relocRate(){ return Math.max(4, Math.round(2 + S.st.elder * .12 + S.st.swing * .1 + S.st.investor * .05 - Math.max(0, S.tenant - 50) * .2 + (S.flags.loanBetter ? 4 : 0))); }

function drawEvent(){
  if (S.forcedEvent){ const id = S.forcedEvent; S.forcedEvent = null; if (!S.usedEvents.includes(id)) S.usedEvents.push(id); return id; }
  if (demandDue()) return openDemand();
  if (S.chTurnFirst && Math.random() < .35) return null;
  const pool = EVENTS.filter(e => e.w > 0 && S.chapter >= e.ch[0] && S.chapter <= e.ch[1] && !(e.once && S.usedEvents.includes(e.id)) && (!e.cond || e.cond()));
  if (!pool.length) return 'quiet';
  const total = pool.reduce((a, e) => a + e.w, 0); let r = Math.random() * total;
  for (const e of pool){ r -= e.w; if (r <= 0){ if (e.once) S.usedEvents.push(e.id); return e.id; } }
  return pool[0].id;
}

function negotiate(fid, card){
  const f = F[fid], m = f.mult[card], before = S.st[fid], cBefore = agreeCount();
  let eff, note = '';
  if (card === 'num'){ const rf = clamp((S.ratio - 80) / 20, .3, 1.3); eff = 12 * m * rf; if (rf < .85) note = '비례율이 낮아 숫자의 설득력이 떨어졌습니다.'; }
  else if (card === 'emo'){ const n = S.fatigue[fid] || 0; eff = 11 * m * [1, .6, .35, .2][Math.min(n, 3)]; S.fatigue[fid] = n + 1; if (n >= 1) note = '같은 이야기를 또 들은 탓에 효과가 줄었습니다.'; }
  else if (card === 'give'){ eff = 20 * m; const g = f.give, parts = [];
    if (g.ratio){ S.ratio += g.ratio; parts.push(`비례율 ${g.ratio}%p`); }
    if (g.settle){ S.settle += g.settle; parts.push(`재정착 예상 +${g.settle}%p`); }
    if (g.flag){ S.flags[g.flag] = true; parts.push('비대위 추천 감사 선임'); }
    note = '대가: ' + parts.join(' · '); }
  else { eff = 14 * m; S.integrity -= 4; if (fid !== 'committee') adj('committee', -3); if (m < 0) adj('swing', -3); note = '압박은 기록에 남습니다.'; }
  eff *= rnd(.8, 1.2);
  if (eff > 0 && S.st[fid] > 85) eff *= .5;
  if (fid === 'holdout' && S.chapter < 5 && eff > 0) eff = Math.min(eff, 4);
  adj(fid, eff);
  S.use[card]++;
  if (fid === 'holdout' && S.chapter === 5 && S.st.holdout >= 70) S.cd.holdoutDone = true;
  const d = S.st[fid] - before;
  const line = REACT[fid][card][d >= 5 ? 0 : 1];
  chat(fid === 'swing' ? pick(['a1','a2','a4']) : fid, line);
  if (S.chapter === 2){ S.cd.met = S.cd.met || {}; S.cd.met[fid] = true; }
  fixAll();
  const dm = demandCheck();
  return {fid, card, d, line, note, dm, cd: agreeCount() - cBefore};
}

/* ───────── 턴 진행 ───────── */
function startTurn(first){
  if (!first){ S.turn++; }
  S.ap = 2; S.modal = null; S.eventResult = null;
  S.eventId = drawEvent(); S.chTurnFirst = false;
  S.phase = S.eventId ? 'event' : 'action';
  save(); render();
}

function onChapterStart(c){
  S.cd = {used:{}}; S.fatigue = {}; S.chTurnFirst = true;
  if (c === 1){ S.deadlineFor = 1; S.deadlineTurn = S.turn + 4; chat('staff','추진위 승인 났습니다! 이제 조합설립인가까지 2년입니다.'); }
  if (c === 2){ S.deadlineFor = 3; S.deadlineTurn = S.turn + 6; S.cd.joint = 0; S.cd.builder = null; S.forcedEvent = 'gift'; chat('staff','조합설립인가 축하드립니다! 이제 3년 안에 사업시행계획인가를 신청해야 합니다.'); }
  if (c === 3){ S.cd.permit = 30 + (S.flags.councilFriend ? 10 : 0) - (S.flags.councilAngry ? 10 : 0); }
  if (c === 4){ S.deadlineFor = null; S.forcedEvent = 'costHike'; const b = burden().b; adj('elder', -Math.round(Math.max(0, b - 3.2) * 15)); }
  if (c === 5){ S.cd.reloc = 0; S.cd.holdoutDone = S.st.holdout >= 70; S.cd.expropTurn = null; chat('a2','이삿짐 싸는 집들이 하나둘 보이네요.'); }
  if (c === 6){ S.cd.build = 0; S.cd.speed = S.flags.builder === 'B' ? 25 : 20; S.cd.market = pick(['up','flat','flat','down']); S.cd.sold = false; }
  if (c >= 2) S.cd.dmAt = S.turn + 1;   // 단계 첫 반기: 고정 사건 카드 다음에 바로 요구 카드
  if (c === 2) S.cd.met = {};
  if (c === 3) S.forcedEvent = 'shopShock';
  S.chTurnFirst = !S.forcedEvent;
}

function endTurn(){
  S.modal = null;
  const ch = S.chapter;
  const interest = ch >= 5 ? .8 : ch >= 2 ? .6 : .2;
  S.ratio -= interest * S.rate;
  adj('investor', clamp((S.ratio - 100) * .25, -4, 4) - (S.rate >= 1.3 ? 2 : 0));
  adj('swing', (consentExcept('swing') - S.st.swing) * .2);
  if (S.turn >= 16){ adj('elder', -1); adj('swing', -1); }
  if (ch >= 2){ adj('elder', -2); adj('swing', -3); adj('shop', -1); if (S.st.committee < 25) adj('swing', -1); }   // 사업 장기화 피로와 비대위 여론전
  if (ch >= 2 && ch <= 5 && !S.flags.tenantPlan) S.tenant += 4;
  if (ch === 5){
    S.cd.reloc = clamp(S.cd.reloc + relocRate(), 0, 100);
    if (!S.cd.holdoutDone && S.cd.expropTurn != null && S.turn + 1 >= S.cd.expropTurn){ S.cd.holdoutDone = true; addNews('지방토지수용위원회, 가람3구역 수용재결'); chat('holdout','…법이 그렇다니 어쩔 수 없지.'); }
  }
  if (ch === 6){
    S.cd.build = clamp(S.cd.build + S.cd.speed, 0, 100);

const ASSET_URL = {};
let assetEls = null;
function assetUrl(path){
  if (ASSET_URL[path]) return ASSET_URL[path];
  if (!assetEls){ assetEls = {}; document.querySelectorAll('script[data-asset]').forEach(el => { assetEls[el.dataset.asset] = el; }); }
  const el = assetEls[path];
  if (!el) return encodeURI(path);
  try { const bin = atob(el.textContent.trim()), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    ASSET_URL[path] = URL.createObjectURL(new Blob([u8], {type:el.dataset.type || ''}));
    el.textContent = ''; delete assetEls[path];
    return ASSET_URL[path];
  } catch(e){ return encodeURI(path); }
}

const PWA = (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) && !!document.querySelector('link[rel="manifest"]');
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
let installEvt = null;
if (PWA){
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });

}
function installBtnHTML(){ return PWA && !isStandalone() ? '<button type="button" class="btn ghost install-btn" data-act="installApp">📲 앱으로 설치</button>' : ''; }
function installGuide(){
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const el = document.createElement('div');
  el.className = 'overlay'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', '홈 화면에 앱으로 설치');

    <p class="g-note">설치하면 도장 모양 아이콘이 홈 화면에 생기고, 주소창 없이 전체 화면으로 열립니다. 한 번 열어 두면 인터넷 없이도 할 수 있습니다.</p>

function hallBanner(t){ return `<div class="banner"><small>가람동 3구역 주택재개발정비사업조합</small><span class="bt">${t}</span></div>`; }

function voteBlock(count, labelYes, labelNo, revealAct, extra){
  return `<div class="vote"><div class="dots" id="voteDots" aria-hidden="true">${'<i class="dot"></i>'.repeat(200)}</div>
    <div class="tally" data-say="3"><div class="g-name">${labelYes}</div><div class="big num" id="voteYes">0</div><div class="g-note">${labelNo}</div>
      <div id="voteDone" hidden>${extra}<button class="btn red" data-act="${revealAct}">결과 확인</button></div></div></div>`;
}

function assemblyHTML(){
  const A = S.asm, D = ASM[A.kind];
  let body = '';
  if (A.step === 'q') body = `<div class="bubble">${av('committee')}<p data-say="1">${D.q}</p></div>
    <div class="choices">${ASM_ANS.map((a, i) => `<button class="choice" data-act="asmAns" data-i="${i}"><strong>${a.label}</strong></button>`).join('')}</div>`;
  else body = `<div class="result" data-say="2">${A.react}</div>${voteBlock(A.yesCount, '찬성', A.two ? '3분의 2(134명) 이상 찬성해야 가결' : '과반(101명)을 넘어야 가결', 'asmFinish', '')}
    <div id="asmReveal" hidden><div class="bigstamp${A.pass ? '' : ' fail'}">${A.pass ? '가결' : '부결'}</div></div>`;
  return `<div class="hall">${hallBanner(D.title)}<div class="agenda" data-say="0">${D.agenda}</div><div class="row" style="justify-content:center">${sayBtn()}</div>${body}</div>`;
}

function recallHTML(){
  const R = S.recall;
  let body = '';
  if (R.step === 'defend') body = `<div class="bubble">${av('committee')}<p data-say="1">조합원 10분의 1 이상의 요구로 해임총회를 소집했습니다. 조합장, 마지막으로 하실 말씀 있으십니까?</p></div>
    <div class="tip"><div class="law">도시정비법 제43조 제4항</div><p>조합원 과반수 출석과 출석 조합원 과반수 동의로 해임됩니다.</p></div>
    <div class="choices">${RECALL_ANS.map((a, i) => `<button class="choice" data-act="recallAns" data-i="${i}"><strong>${a.label}</strong></button>`).join('')}</div>`;
  else body = `<div class="result" data-say="2">${R.react}</div>${voteBlock(R.yesCount, '해임 찬성', '출석 조합원 과반이 찬성하면 해임', 'recallFinish', '')}
    <div id="recallReveal" hidden><div class="bigstamp${R.removed ? ' fail' : ''}">${R.removed ? '해임' : '유임'}</div></div>`;
  return `<div class="hall">${hallBanner('조합장 해임총회')}<div class="agenda" data-say="0">소집 요구자 대표 · 비상대책위원장 정의로</div><div class="row" style="justify-content:center">${sayBtn()}</div>${body}</div>`;
}

function deadlineHTML(){
  const target = {0:'추진위원회 승인', 1:'조합설립인가', 3:'사업시행계획인가'}[S.deadlineFor];
  const can = !S.extUsed && consent() >= 30;
  return `<div class="ev" style="--tc:var(--hazard)"><div class="ev-type" style="color:var(--ink)">일몰제 기한 도래</div>
    <h2 data-say="0">${target} 신청 기한이 끝났습니다</h2>${sayBtn()}
    <p data-say="1">정해진 기간 안에 ${target}을 신청하지 못했습니다. 이대로라면 정비구역이 해제됩니다. 토지등소유자 30% 이상이 동의하면 지정권자에게 기간 연장을 요청할 수 있습니다.</p>
    <div class="choices"><button class="choice" data-act="extend" ${can ? '' : 'disabled'}><strong>기간 연장을 요청한다</strong><span>게임당 1번. 1년(2반기) 연장. 투자자와 부동층이 지칩니다.</span></button>
      <button class="choice" data-act="giveUp"><strong>받아들인다</strong><span>정비구역 해제</span></button></div></div>`;
}

function tipHTML(t){ return `<div class="tip"><div class="law">법령 노트 · ${t.law}</div><p>${t.text}</p><p class="sub">${t.sub}</p></div>`; }

function clearHTML(){
  const ch = S.chapter;
  return `<div class="hall"><div class="eyebrow">제${ch + 1}장 완료</div>
    <h2 style="font-size:28px" data-say="0">${CH[ch]} ${CH_STAMP[ch]}</h2><div class="row">${sayBtn()}</div>
    <div class="bigstamp">${CH_STAMP[ch]}</div>
    <div data-say="1">${tipHTML(TIPS[ch])}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn red" data-act="clearNext" data-autofocus>${ch === 6 ? '입주식으로' : '다음 단계로 →'}</button></div></div>`;
}

function modalHTML(){
  const M = S.modal; if (!M) return '';
  let inner = '';
  if (M.type === 'neg'){
    const f = F[M.f];
    inner = `<div class="fac-top"><img class="mport" style="--c:${f.c}" src="${PORTRAITS[M.f].card}" alt=""><div><h2 id="mTitle">${f.name}와 협상</h2><div class="fac-role">${f.role} · 찬성 ${S.st[M.f]}%</div></div></div>
      <div class="hint"><b>오실장 메모</b> · ${f.hint}</div>
      <div class="cards">${Object.keys(CARDS).map(k => { const c = CARDS[k];
        const extra = k === 'give' ? `<span><b>내줄 것:</b> ${f.give.label}</span>` : k === 'emo' && S.fatigue[M.f] ? `<span>이번 단계에서 ${S.fatigue[M.f]}번 썼음</span>` : '';
        return `<button class="ncard" data-act="card" data-f="${M.f}" data-c="${k}"><span class="k">${c.k}</span><strong>${c.label}</strong><span>${c.desc}</span>${extra}</button>`; }).join('')}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-act="closeModal">그만두기</button></div>`;
  } else if (M.type === 'negRes'){
    const r = M.r, f = F[r.fid];
    inner = `<div class="fac-top"><img class="mport" style="--c:${f.c}" src="${PORTRAITS[r.fid].card}" alt=""><div><h2 id="mTitle">${CARDS[r.card].label}</h2><div class="fac-role">${f.name}</div></div></div>
      <div class="quote" data-say="0">“${esc(r.line)}”</div><div class="row">${sayBtn()}</div>
      <div class="row" style="gap:24px"><div><div class="g-name">${f.short} 찬성</div><div class="delta num ${r.d > 0 ? 'up' : r.d < 0 ? 'down' : ''}">${r.d > 0 ? '+' : ''}${r.d}%p</div></div>
        <div><div class="g-name">찬성 조합원</div><div class="delta num ${r.cd > 0 ? 'up' : r.cd < 0 ? 'down' : ''}">${r.cd > 0 ? '+' : ''}${r.cd}명</div></div></div>
      ${r.note ? `<p class="g-note">${r.note}</p>` : ''}${dmNote(r.dm)}
      <div class="row" style="justify-content:flex-end"><button class="btn red" data-act="closeModal" data-autofocus>확인</button></div>`;
  } else if (M.type === 'choose'){
    const C = CHOOSERS[M.key]();
    inner = `<h2 id="mTitle">${C.title}</h2><p>${C.text}</p><div class="choices">${C.options.map(o => `<button class="choice" data-act="opt" data-k="${o.key}" ${o.disabled ? 'disabled' : ''}><strong>${o.label}${S.cd.builder === o.key && M.key === 'pickBuilder' ? ' · 현재 선택' : ''}</strong><span>${o.note || o.sub}</span></button>`).join('')}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-act="closeModal">그만두기</button></div>`;
  } else if (M.type === 'info'){
    inner = `<h2 id="mTitle" data-say="0">${M.title}</h2><div class="info-body" data-say="1">${M.html}</div><div class="row" style="justify-content:space-between">${sayBtn()}<button class="btn red" data-act="closeModal" data-autofocus>확인</button></div>`;
  } else if (M.type === 'narr'){
    inner = narrSettingsHTML();
  } else if (M.type === 'restart'){
    inner = `<h2 id="mTitle">새 게임을 시작할까요?</h2><p>지금 진행 중인 가람3구역 사업은 사라지고, 처음 화면으로 돌아갑니다. 조합장 이름도 새로 정할 수 있어요.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="closeModal">계속하기</button><button class="btn red" data-act="toTitle" data-autofocus>처음 화면으로</button></div>`;
  }
  return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">${inner}</div></div>`;
}

function endingHTML(){
  const E = ENDINGS[S.ending], st = S.endStats, got = endingsGot();
  const u = S.use, top = Object.keys(u).sort((a, b) => u[b] - u[a])[0];
  const T = TYPES[u[top] ? top : 'emo'];
  const tag = S.integrity >= 75 ? '원칙주의자' : S.integrity < 45 ? '회색지대 전문가' : '현실주의자';
  return `<div class="end-wrap">
    <article class="front"><div class="mast">가람일보<small>${st.when}</small></div>
      <div class="kicker">${E.kicker} · ${E.name}</div><h1 data-say="0">${E.head}</h1><p data-say="1">${E.body(st)}</p><div class="row" style="margin-top:12px">${sayBtn()}</div></article>
    <div class="stats">
      <div class="stat"><div class="g-name">최종 비례율</div><div class="g-val num">${st.r}<small>%</small></div></div>
      <div class="stat"><div class="g-name">원주민 재정착률</div><div class="g-val num">${st.s}<small>%</small></div></div>
      <div class="stat"><div class="g-name">사업 기간</div><div class="g-val num">${st.years}<small>년</small></div></div>
      <div class="stat" style="border-color:var(--banner)"><div class="g-name">청렴도 (이제 공개)</div><div class="g-val num" style="color:var(--banner)">${st.i}</div></div>
    </div>
    <div class="sheet type" data-say="2"><div class="stamp">${T.sub}</div><div><h3 style="color:var(--ink);font-size:22px;letter-spacing:0">${esc(S.name)} 조합장 · ${T.name}</h3>
      <p style="margin:4px 0 0">${T.desc} 청렴 성향은 <b>${tag}</b>.</p>
      <p class="g-note" style="margin-top:6px">협상 카드 사용: 숫자 ${u.num} · 감정 ${u.emo} · 양보 ${u.give} · 압박 ${u.push}</p></div></div>
    ${S.cleared.length ? `<div class="sheet"><h3>이번 판에서 모은 법령 노트 ${S.cleared.length}장</h3><div style="display:flex;flex-direction:column;gap:10px">${S.cleared.map(i => tipHTML(TIPS[i])).join('')}</div></div>` : ''}
    ${dexHTML(got)}
    <p class="end-credit">「재개발 조합장」 기획·제작 · <strong>${MAKER}</strong></p>
    <div class="row"><button class="btn red" data-act="restart" data-autofocus>다시 조합장 되기</button><button class="btn ghost" data-act="home">타이틀로</button>${soundBarHTML()}</div>
    <p class="g-note">법령 노트는 게임용 요약입니다. 실제 사업에는 현행 법령과 조례를 확인하세요.</p>
  </div>`;
}

function animateVote(yesCount, revealId){
  clearTimeout(animTimer);
  const dots = [...document.querySelectorAll('#voteDots .dot')], yesEl = $('#voteYes'), done = $('#voteDone');
  if (!dots.length) return;
  const finishAnim = () => { dots.forEach((d, i) => d.className = 'dot ' + (i < yesCount ? 'yes' : 'no')); yesEl.textContent = yesCount + '명'; done.hidden = false; const r = $('#' + revealId); if (r) r.hidden = false; const b = done.querySelector('button'); if (b) b.focus({preventScroll:true}); };
  if (reduced) return finishAnim();
  let i = 0;
  const step = () => { const end = Math.min(200, i + 8);
    for (; i < end; i++) dots[i].className = 'dot ' + (i < yesCount ? 'yes' : 'no');
    yesEl.textContent = Math.min(i, yesCount) + '명';
    if (i < 200) animTimer = setTimeout(step, 28); else setTimeout(finishAnim, 250); };
  step();
}

/* ───────── 입력 ───────── */
document.addEventListener('submit', e => {
  if (e.target.id === 'startForm'){ e.preventDefault(); const n = ($('#pname').value || '').trim().slice(0, 10); AU.override = null; newGame(n || '김가람'); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'narrVoice'){ ttsVoices.choose(e.target.value); NARR.preview(); }
  if (e.target.id === 'narrRate'){ NS.rate = clamp(+e.target.value || 1, .7, 1.5); narrPrefs(); NARR.preview(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'vol') return;
  AU.vol = clamp(+e.target.value / 100, 0, 1); audioPrefs();
  if (AU.cur && AU.key){ clearInterval(AU.cur._fade); setVol(AU.cur, BGM[AU.key].v * AU.vol * duckF()); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'theme'){ toggleTheme(); return; }
  if (act === 'installApp'){ if (installEvt){ const ev = installEvt; installEvt = null; ev.prompt(); (ev.userChoice || Promise.resolve()).finally(() => { if (screen === 'title') render(); }); } else installGuide(); return; }
  if (act === 'narrToggle'){ if (NARR.mode === 'playing') NARR.stop(); else NARR.replay(); return; }
  if (act === 'narrAuto'){ NS.auto = !NS.auto; narrPrefs(); if (!NS.auto) NARR.stop(); updateNarrUI(); return; }
  if (act === 'narrPreview'){ NARR.preview(); return; }
  if (act === 'narrCast'){ NARR.sample(b.dataset.spk); return; }
  if (act === 'narrRec'){ NS.recorded = !NS.recorded; narrPrefs(); NARR.clear(); updateNarrUI(); return; }
  if (act === 'narrSettings'){ if (S){ S.modal = {type:'narr'}; render(); } return; }
  if (act === 'sound'){ toggleSound(); return; }
  if (act === 'continue'){ const s = loadSave(); if (s){ S = s; screen = 'game'; AU.override = null; render(); } return; }
  if (act === 'home'){ screen = 'title'; AU.override = null; render(); return; }
  if (act === 'toTitle'){ AU.override = null; try { localStorage.removeItem('jokhap_save_v1'); if (S) localStorage.setItem('jokhap_name', S.name); } catch(err){} S = null; screen = 'title'; render(); window.scrollTo(0, 0); return; }
  if (act === 'restart'){ AU.override = null; try { localStorage.removeItem('jokhap_save_v1'); } catch(err){} const n = S ? S.name : '김가람'; newGame(n); return; }
  if (!S) return;
  switch (act){
    case 'askRestart': S.modal = {type:'restart'}; break;
    case 'evChoice': { const e2 = evById(S.eventId), c = e2.choices[+b.dataset.i]; const txt = c.run(); fixAll(); const dm = demandCheck(); S.eventResult = {label:c.label, text:txt + (dm ? '<br><b>✓ 요구 해결</b> · ' + dm : '')}; break; }
    case 'evDone': S.phase = 'action'; S.eventId = null; S.eventResult = null;
      if (S.integrity < 20 && Math.random() < .5) return finish('raid');
      if (demandDue()){ S.eventId = openDemand(); S.phase = 'event'; }
      break;
    case 'neg': S.modal = {type:'neg', f:b.dataset.f}; break;
    case 'card': { if (S.ap < 1) break; const r = negotiate(b.dataset.f, b.dataset.c); S.ap--; S.modal = {type:'negRes', r}; break; }
    case 'closeModal': S.modal = null; break;
    case 'special': { const a = (SPECIALS[S.chapter] || []).find(x => x.id === b.dataset.id); if (!a || S.ap < 1) break;
      if (a.choose){ S.modal = {type:'choose', key:a.choose, actId:a.id}; break; }
      S.cd.used[a.id] = used(a.id) + 1; S.ap--; const txt = a.run(); fixAll(); chat('me', a.label + ' 진행합니다.');
      S.modal = {type:'info', title:a.label, html:`<p>${txt}</p>${dmNote(demandCheck())}`}; break; }
    case 'opt': { const M = S.modal; const C = CHOOSERS[M.key](); const txt = C.apply(b.dataset.k); S.cd.used[M.actId] = used(M.actId) + 1; S.ap--; fixAll();
      S.modal = {type:'info', title:C.title, html:`<p>${txt}</p>${dmNote(demandCheck())}`}; break; }
    case 'attempt': attemptGoal(); return;
    case 'endTurn': endTurn(); return;
    case 'asmAns': asmAnswer(+b.dataset.i); return;
    case 'asmFinish': asmFinish(); return;
    case 'recallAns': recallAnswer(+b.dataset.i); return;
    case 'recallFinish': recallFinish(); return;
    case 'clearNext': clearNext(); return;
    case 'extend': S.extUsed = true; S.deadlineTurn += 2; adj('investor', -8); adj('swing', -4); addNews('가람3구역 일몰 기한 1년 연장… "마지막 기회"'); chat('officer','토지등소유자 요청에 따라 기한을 1년 연장합니다. 더는 어렵습니다.'); startTurn(false); return;
    case 'giveUp': finish('sunset'); return;
  }
  save(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S && S.modal && ['neg','choose','restart','narr'].includes(S.modal.type)){ S.modal = null; render(); } });

/* ───────── 부팅 ───────── */
function start(data){
  if (data && data.S){ S = data.S; screen = data.screen || 'game'; }
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({S: S ? JSON.parse(JSON.stringify(S)) : null, screen})); } catch(e){}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
window.__game = {get S(){ return S; }, get AU(){ return AU; }, newGame, endTurn, render, finish};
})();
</script>
